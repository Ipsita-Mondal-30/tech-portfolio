<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ipsita Mondal — Portfolio</title>
    <style>
      body, html {
        margin: 0;
        height: 100%;
        overflow: hidden;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      }
      
      .container {
        position: relative;
        width: 100%;
        height: 100%;
      }
      
      iframe {
        border: none;
        width: 100%;
        height: 100%;
      }
      
      .social-bar {
        position: fixed;
        bottom: 20px;
        right: 20px;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(10px);
        padding: 16px 20px;
        display: flex;
        gap: 20px;
        align-items: center;
        box-shadow: 0 4px 20px rgba(0, 0, 0, 0.15);
        z-index: 9999;
        border-radius: 10px;
      }
      
      .social-bar a {
        color: #333;
        text-decoration: none;
        font-size: 14px;
        font-weight: 500;
        transition: color 0.3s ease, transform 0.2s ease;
        display: flex;
        align-items: center;
        gap: 6px;
      }
      
      .social-bar a:hover {
        color: #0066cc;
        transform: translateY(-2px);
      }
      
      .social-icon {
        width: 20px;
        height: 20px;
      }
      
      @media (max-width: 768px) {
        .social-bar {
          bottom: 16px;
          right: 16px;
          padding: 14px 18px;
          gap: 18px;
        }
        
        .social-bar a {
          font-size: 0;
        }
        
        .social-icon {
          width: 24px;
          height: 24px;
        }
      }
    </style>
  </head>

    <div class="container">
